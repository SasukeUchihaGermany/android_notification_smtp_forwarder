apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"
    defaultConfig {
        applicationId "android.notifications"
        minSdkVersion 28
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SMTP_HOST", '"smtp.gmail.com"'
        buildConfigField "int", "SMTP_PORT", "587"
        buildConfigField "String", "SMTP_USER", '"' + (project.findProperty('SMTP_USER') ?: System.getenv('SMTP_USER') ?: '') + '"'
        buildConfigField "String", "SMTP_PASS", '"' + (project.findProperty('SMTP_PASS') ?: System.getenv('SMTP_PASS') ?: '') + '"'
        buildConfigField "String", "MAIL_TO", '"' + (project.findProperty('MAIL_TO') ?: System.getenv('MAIL_TO') ?: '') + '"'
        buildConfigField "String", "MAIL_FROM_NAME", '"' + (project.findProperty('MAIL_FROM_NAME') ?: System.getenv('MAIL_FROM_NAME') ?: 'Phone Notifications') + '"'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/NOTICE.md'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation("com.squareup.okhttp3:okhttp:4.3.1")

    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
